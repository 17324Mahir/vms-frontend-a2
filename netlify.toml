[build]
  publish = "build/web"
  command = "./scripts/build_web.sh"

[build.environment]
  NODE_VERSION = "24"
  API_BASE_URL = "https://vms-backend-a2.onrender.com"

# Single-Page Application (SPA) fallback routing
# Non-forced 200 rewrite allows existing static files to be served directly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for production static delivery
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Prevent caching of index.html and bootstrapping files so users always receive latest app bundles
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workspace.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_bootstrap.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/main.dart.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
